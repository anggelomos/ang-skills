services:
  grill-hub:
    build:
      context: ../..
      dockerfile: scripts/grill-hub/Dockerfile
    container_name: grill-hub
    restart: unless-stopped
    environment:
      # where browsers reach the public port, e.g. https://grill-hub.example.com. Set it in .env
      GRILL_HUB_PUBLIC_URL: ${GRILL_HUB_PUBLIC_URL:-http://localhost:7170}
    ports:
      - "127.0.0.1:7170:7170"  # public: point your tunnel or reverse proxy here
      - "127.0.0.1:7171:7171"  # agent: grill.py only. Never expose it
    volumes:
      - grill-hub-data:/data

volumes:
  grill-hub-data:
